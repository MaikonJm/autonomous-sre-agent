# CI: qualidade e segurança a cada push/PR. Tudo aqui BLOQUEIA o merge.
# Os scanners rodaram primeiro em modo relatório; os achados foram triados (corrigidos,
# ou aceitos com justificativa em .trivyignore / nosemgrep) e então viraram gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-tests:
    name: Testes do agente (cluster simulado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/sre-agent/requirements.txt pytest
      - run: cd apps/sre-agent && pytest -q

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  manifests:
    name: Manifests Kubernetes (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for f in k8s/orders/*.yaml k8s/loadtest/*.yaml k8s/sre-agent/*.yaml k8s/observability/dashboards.yaml; do
            sed 's#ORDERS_API_IMAGE#x/y:z#;s#SRE_AGENT_IMAGE#x/a:b#' "$f" > /tmp/m.yaml
            ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' /tmp/m.yaml
          done

  promql:
    name: PromQL válido (alertas, dashboards, agente)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install promql-parser pyyaml
      - name: Dashboards gerados estão em dia com o script
        run: |
          python3 k8s/observability/build_dashboards.py
          git diff --exit-code k8s/observability/dashboards.yaml
      - run: python3 scripts/ci/check_promql.py

  security:
    name: Segurança (SAST + IaC + dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST com Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/dockerfile --config p/terraform --metrics=off --error \
            --exclude infra/azure-aks-reference
      - name: Trivy (dependências vulneráveis + misconfig em Dockerfile, K8s e Terraform)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs infra/azure-aks-reference .
