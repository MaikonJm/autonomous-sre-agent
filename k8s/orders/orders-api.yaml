apiVersion: v1
kind: Namespace
metadata:
  name: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
  labels: { app: orders-api }
spec:
  replicas: 2
  revisionHistoryLimit: 10        # o agente precisa do histórico para rollback
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: app
          image: ORDERS_API_IMAGE   # substituído pelo scripts/deploy.sh
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: APP_VERSION, value: "v1" }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orders
  labels: { app: orders-api }
spec:
  selector: { app: orders-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-api
  namespace: orders
spec:
  selector:
    matchLabels: { app: orders-api }
  endpoints:
    - { port: http, path: /metrics, interval: 15s }
